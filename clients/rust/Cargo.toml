[package]
name = "priostack-acn"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "Official Rust client for the Priostack Agent Context Network (ACN) — MCP over JSON-RPC 2.0."
homepage = "https://priostack.com"
repository = "https://github.com/ideaswave/priostack"
readme = "README.md"
keywords = ["mcp", "acn", "agent-memory", "priostack", "json-rpc"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
# One well-known HTTP+JSON dependency, pinned. rustls-tls keeps the build free of
# a system OpenSSL requirement; the `json` feature pulls in serde_json.
reqwest = { version = "=0.12.9", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "=1.0.133"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"
