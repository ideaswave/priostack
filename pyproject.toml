[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "priostack"
version = "0.2.0"
description = "Python SDK and MCP interface for Priostack Agent Context Network (ACN)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Ideaswave", email = "contact@ideaswave.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "agent-memory",
    "priostack",
    "llm",
    "context-management"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff==0.6.9"]

[project.urls]
Homepage = "https://priostack.com"
Documentation = "https://priostack.com/acn"
Repository = "https://github.com/ideaswave/priostack"
Issues = "https://github.com/ideaswave/priostack/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/priostack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"
src = ["src", "tests"]

[tool.ruff.lint]
# A stable, version-independent rule set: pycodestyle errors/warnings, pyflakes,
# and import sorting. Keeps CI deterministic regardless of the installed ruff.
select = ["E", "F", "I", "W"]
